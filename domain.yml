version: "3.1"

intents:
  - greet
  - goodbye
  - thank
  - inform  # BƯỚC 2: Intent để user cung cấp thông tin cho form
  - ask_about_school
  - ask_list_programs
  - ask_program_info
  - ask_tuition
  - ask_scholarship
  - ask_admission_methods
  - ask_admission_documents
  - ask_location
  - ask_contact
  - ask_schedule
  - ask_facility
  - ask_club
  - ask_support
  - ask_dorm        
  - ask_major_count     # Hỏi có bao nhiêu ngành
  - ask_study_mode      # Hỏi hình thức học
  - ask_admission_time  # Hỏi thời gian tuyển sinh
  - ask_fee_payment     # Hỏi cách đóng học phí
  - bot_challenge
  - nlu_fallback        # COMMENT: intent fallback mặc định của Rasa
  - ask_tuition_specific # Hỏi học phí theo một ngành cụ thể.
  - ask_scholarship_condition # Hỏi về điều kiện để nhận học bổng.
  - ask_exam_schedule # Hỏi về lịch thi.
  - ask_campuses # Hỏi thông tin về các cơ sở (campus) của trường.
  - ask_support_problem # Hỏi về cách giải quyết một vấn đề cụ thể cần hỗ trợ.
  - out_of_scope # Câu hỏi ngoài phạm vi
  - ask_recommend_programs # Tư vấn ngành theo tổ hợp môn và sở thích
  - ask_directions # Hỏi đường đến trường (CHỨC NĂNG MỚI - CHỈ ĐƯỜNG)
  - confirm_transit_info # Xác nhận muốn biết thông tin xe buýt (CHỨC NĂNG MỚI)

# Entities - Các thực thể cần trích xuất
entities:
  - program
  - subject
  - exam_type
  - semester
  - class
  - campus
  - location
  - facility
  - document
  - support_type
  - system
  - payment
  - scholarship_type
  - contact_type
  - club_type
  - time
  - academic_level
  - admission_method
  - education_level
  - student_type
  - financial_status
  - language_certificate
  - geographical_area
  - extracurricular_activity
  - department
  - required_documents
  - grade_score
  - subject_combination  # Tổ hợp môn (A00, D01, C00...)
  - interest  # Sở thích/ngành quan tâm

# =============================================================================
# SLOTS - Lưu trữ thông tin ngữ cảnh hội thoại
# =============================================================================
# Slots giúp bot "nhớ" thông tin trong suốt cuộc hội thoại

slots:
  # ========================
  # PROGRAM/MAJOR (Ngành học)
  # ========================
  program:
    type: text
    influence_conversation: true  # Ảnh hưởng đến flow hội thoại
    mappings:
    - type: from_entity
      entity: program
  
  program_id:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  # ========================
  # ACADEMIC INFO (Thông tin học tập)
  # ========================
  subject:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: subject
  
  exam_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: exam_type
  
  semester:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: semester
  
  academic_year:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: academic_year
  
  # ========================
  # CAMPUS & LOCATION (Cơ sở & Địa điểm)
  # ========================
  campus:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: campus
  
  location:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: location
  
  # CHỨC NĂNG MỚI - CHỈ ĐƯỜNG
  user_location:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: directions_form
          requested_slot: user_location
  
  target_campus:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: directions_form
          requested_slot: target_campus
  
  want_transit_info:
    type: bool
    influence_conversation: false
    mappings:
    - type: from_intent
      intent: confirm_transit_info
      value: true
    - type: from_intent
      intent: deny
      value: false
  
  facility:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: facility
  
  # ========================
  # FINANCIAL (Tài chính)
  # ========================
  tuition_amount:
    type: float
    influence_conversation: false
    mappings:
    - type: custom
  
  scholarship_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: scholarship_type
  
  scholarship_value:
    type: float
    influence_conversation: false
    mappings:
    - type: custom
  
  # ========================
  # DOCUMENTS & SUPPORT (Hồ sơ & Hỗ trợ)
  # ========================
  document:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: document
  
  support_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: support_type
  
  contact_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: contact_type
  
  # ========================
  # USER CONTEXT (Ngữ cảnh người dùng)
  # ========================
  user_name:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  user_student_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: student_type
  
  user_gpa:
    type: float
    influence_conversation: false
    mappings:
    - type: custom
  
  # ========================
  # CONVERSATION STATE (Trạng thái hội thoại)
  # ========================
  last_intent:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  conversation_stage:
    type: categorical
    values:
      - greeting
      - exploring
      - specific_query
      - follow_up
      - closing
    influence_conversation: true
    mappings:
    - type: custom
  
  previous_programs_mentioned:
    type: list
    influence_conversation: false
    mappings:
    - type: custom
  
  topics_discussed:
    type: list
    influence_conversation: false
    mappings:
    - type: custom
  
  # ========================
  # PROGRAM RECOMMENDATION (Tư vấn ngành)
  # ========================
  subject_combination:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: subject_combination
  
  interest:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: interest
  
  recommended_programs:
    type: list
    influence_conversation: false
    mappings:
    - type: custom
  
  # ========================
  # FEEDBACK & QUALITY (Phản hồi & Chất lượng)
  # ========================
  user_satisfied:
    type: bool
    influence_conversation: false
    mappings:
    - type: custom
  
  needs_human_handoff:
    type: bool
    influence_conversation: true
    mappings:
    - type: custom

responses:
  utter_greet:
    - text: "Chào bạn 👋! Mình là trợ lý ảo của Đại học Văn Hiến. Bạn muốn tìm hiểu thông tin gì nè?"
    - text: "Hiii! Mình là trợ lý VHU đây, có gì cần giúp không nè? 😊"
    - text: "Xin chào bạn! Mình ở đây để giúp bạn tìm hiểu về VHU nha ✨"
    - text: "Chào bạn nha! Cứ hỏi mình bất cứ điều gì về Văn Hiến nhé 💙"

  utter_goodbye:
    - text: "Bye bye! Chúc bạn một ngày vui vẻ nha 💪✨"
    - text: "Hẹn gặp lại bạn nha 👋 Chúc học tốt!"
    - text: "Tạm biệt bạn nè! Có gì cần giúp cứ nhắn mình nhé! 💙"

  utter_thank:
    - text: "Không có gì đâu nè, vui là được rồi 😊"
    - text: "Hehe, được giúp bạn mình cũng vui lắm! 💖"
    - text: "Đó là nhiệm vụ của mình mà! Chúc bạn học tốt nha 🌟"

  utter_about_school:
    - text: |
        Bạn ơi, cho mình giới thiệu về VHU nè:
        
        🎓 **Đại học Văn Hiến** (VHU) được thành lập năm 1997 nha, là trường đại học tư thục uy tín, 
        trực thuộc Bộ Giáo dục & Đào tạo đó. Trường mình hướng đến việc đào tạo toàn diện 
        cả kiến thức lẫn nhân cách cho sinh viên luôn! 💪

  utter_list_programs:
    - text: |
        Mình liệt kê một số ngành hot của trường cho bạn nha:
        
        ✨ **Công nghệ thông tin**  
        ✨ **Quản trị kinh doanh**  
        ✨ **Du lịch - Nhà hàng - Khách sạn**  
        ✨ **Ngôn ngữ Anh, Nhật, Trung**  
        ✨ **Tâm lý học**  
        ✨ **Truyền thông đa phương tiện**  
        ✨ **Kế toán - Tài chính**
        
        Và còn nhiều ngành khác nữa đó! Bạn muốn biết chi tiết ngành nào không nè? 😊

  utter_tuition:
    - text: "Bạn ơi, học phí trung bình khoảng **20-25 triệu đồng/năm** tùy ngành và chương trình học nha! 💰 Bạn muốn biết rõ ngành nào không?"

  utter_scholarship:
    - text: |
        Để mình kể cho bạn nghe về học bổng nè:
        
        🎓 **Học bổng tuyển sinh** - Dành cho tân sinh viên đạt điểm cao
        🎓 **Học bổng thành tích học tập** - Cho bạn nào học giỏi mỗi kỳ
        🎓 **Học bổng hỗ trợ tài chính** - Giúp đỡ bạn có hoàn cảnh khó khăn
        
        Bạn muốn biết chi tiết loại học bổng nào không nè?

  utter_admission_methods:
    - text: |
        Mình tra giúp bạn nè, trường có **4 phương thức tuyển sinh** đó:
        
        1️⃣ **Xét điểm thi THPT** - Dùng điểm thi tốt nghiệp
        2️⃣ **Xét học bạ** - Xét điểm học bạ 3 năm THPT
        3️⃣ **Xét điểm đánh giá năng lực** - Từ ĐHQG TP.HCM hoặc Hà Nội
        4️⃣ **Xét tuyển thẳng** - Theo quy định của Bộ GD&ĐT
        
        Bạn định xét theo phương thức nào nè? 😊

  utter_admission_documents:
    - text: |
        Bạn ơi, đây là danh sách hồ sơ cần chuẩn bị nha:
        
        📂 **Phiếu đăng ký** xét tuyển
        📂 **Bản sao học bạ THPT** (có công chứng)
        📂 **CMND/CCCD** (bản sao)
        📂 **Giấy khai sinh** (bản sao)
        📂 **4 ảnh 3x4** (chụp trong vòng 6 tháng)
        
        Chuẩn bị đầy đủ là OK rồi nha! ✅

  utter_admission_time:
    - text: "Bạn ơi, thời gian tuyển sinh thường từ **tháng 3 đến tháng 9** hàng năm nè! ⏰ Nhớ theo dõi thông báo trên website để không bỏ lỡ nhé!"

  utter_location:
    - text: |
        Trụ sở chính của VHU nằm tại:
        
        🏢 **HungHau House**
        📍 613 Âu Cơ, Phường Tân Phú, Quận Tân Phú, TP. Hồ Chí Minh
        
        ☎️ **Hotline**: 028 6295 1517 | 1800 1568 (miễn phí)
        
        💡 Bạn muốn xem **danh sách tất cả các cơ sở** của VHU không nè? 🏫

  utter_contact:
    - text: |
        Bạn ơi, đây là thông tin liên hệ của trường nha:
        
        📞 **Hotline**: 028 6295 1517  
        📧 **Email**: tuyensinh@vhu.edu.vn  
        🌐 **Website**: www.vhu.edu.vn
        
        Cứ liên hệ thoải mái nha! 😊

  utter_schedule:
    - text: |
        Bạn ơi, mình cho bạn biết lịch học nè:
        
        🗓️ **Học kỳ 1**: Bắt đầu từ tháng 9 hàng năm
        🗓️ **Học kỳ 2**: Bắt đầu từ tháng 2 năm sau
        
        Lịch chi tiết bạn xem trên **VHU Portal** (student.vhu.edu.vn) nha!

  utter_facility:
    - text: |
        Bạn ơi, cơ sở vật chất của trường xịn lắm đó:
        
        🏢 **Phòng học** hiện đại, máy lạnh, projector đầy đủ
        📚 **Thư viện** lớn với nhiều tài liệu
        💻 **Phòng thực hành** máy tính
        ☕ **Căn tin** sạch sẽ, đồ ăn ngon
        🏠 **Ký túc xá** tiện nghi
        🏃 **Khu tự học** yên tĩnh
        
        Cơ sở vật chất đầy đủ cho việc học tập của bạn luôn! 💪

  utter_dorm:
    - text: |
        Bạn ơi, trường có ký túc xá cho sinh viên nha:
        
        🏠 Nằm gần khuôn viên trường, đi lại siêu tiện
        ❄️ Phòng máy lạnh, wifi tốc độ cao
        🍜 Có căn tin, khu sinh hoạt chung
        💰 Giá cả hợp lý, phù hợp sinh viên
        
        Bạn muốn ở KTX thì liên hệ **Phòng CTSV** để đăng ký nha! ✨

  utter_club:
    - text: |
        Wao, trường mình có hơn **15 CLB** cho bạn tham gia nè:
        
        🎵 CLB Âm nhạc  
        🗣️ CLB Tiếng Anh  
        ❤️ CLB Tình nguyện  
        📸 CLB Nhiếp ảnh  
        ⚽ CLB Thể thao
        🎨 CLB Nghệ thuật
        
        Và còn nhiều CLB khác nữa! Đăng ký tại **Phòng CTSV** nha! 🌟

  utter_support:
    - text: |
        Bạn ơi, trường có nhiều dịch vụ hỗ trợ sinh viên lắm:
        
        📚 **Học vụ**: Đăng ký môn, đổi lớp, xem điểm → Phòng Đào tạo
        💰 **Tài chính**: Học bổng, hỗ trợ chi phí → Phòng Tài chính
        💙 **Tâm lý**: Tư vấn, hỗ trợ tinh thần → Phòng CTSV
        🎯 **Nghề nghiệp**: Hướng nghiệp, việc làm → Trung tâm TVVL
        
        Cần gì cứ liên hệ, trường luôn sẵn sàng giúp đỡ bạn nha! 💪

  utter_bot_challenge:
    - text: "Mình là trợ lý ảo của Đại học Văn Hiến đây 🤖, được tạo ra để giúp đỡ bạn tìm hiểu thông tin về trường nha! Cứ hỏi mình thoải mái! 😊"

  # REMOVED utter_fallback - Now using action_gemini_fallback for intelligent responses
  # This response has been replaced by Gemini AI to provide intelligent answers
  # to out-of-scope questions instead of generic fallback messages

  utter_major_count:
    - text: |
        Bạn ơi, trường mình có **44 ngành đào tạo** bậc đại học đó, 
        bao gồm nhiều lĩnh vực như:
        
        💻 Công nghệ thông tin
        💼 Kinh tế - Quản lý  
        🗣️ Ngoại ngữ
        ✈️ Du lịch - Khách sạn
        📺 Truyền thông
        💙 Tâm lý học
        
        Và còn nhiều ngành khác nữa! Bạn muốn biết ngành nào nè? 😊

  utter_study_mode:
    - text: |
        Mình kể cho bạn nghe về các hình thức học nha:
        
        📚 **Chính quy**: Học thứ 2-6, toàn thời gian
        💼 **Vừa làm vừa học**: Học cuối tuần (T7-CN)
        🎓 **Liên thông**: Dành cho bạn đã có bằng cao đẳng
        📖 **Văn bằng 2**: Dành cho bạn đã có bằng ĐH ngành khác
        
        Bạn định học hình thức nào nè? 🤔

  utter_fee_payment:
    - text: |
        Bạn ơi, có nhiều cách đóng học phí lắm:
        
        💵 **Trực tiếp**: Đến Phòng Tài chính đóng tiền mặt
        🏦 **Chuyển khoản**: Chuyển vào TK trường
        📱 **Qua app**: Dùng app ngân hàng (có TK trên website)
        💳 **Trả góp**: Chia nhỏ theo từng học kỳ
        
        Bạn liên hệ Phòng Tài chính để biết thêm chi tiết nha! 💰

  utter_out_of_scope:
    - text: |
        Ôi, câu hỏi này nằm ngoài chuyên môn của mình rồi bạn ơi! 😅
        
        Mình chỉ có thể giúp bạn về:
        📚 Thông tin ngành học, học phí
        🎓 Học bổng, tuyển sinh
        🏫 Cơ sở vật chất, địa chỉ
        📞 Thông tin liên hệ
        
        Bạn có câu hỏi nào về VHU không nè?
    - text: |
        Híc, mình chỉ trả lời về Đại học Văn Hiến thôi bạn ơi! 😊
        
        Hỏi mình về học phí, tuyển sinh, học bổng hay thông tin liên hệ đi nha!
        
        📞 Hoặc gọi: **028 6295 1517** để được tư vấn nhé!

  # =============================================================================
  # RESPONSE VARIATIONS - Nhiều cách trả lời để tránh lặp lại (BƯỚC 2)
  # =============================================================================
  
  # ASKING FOR MORE INFO
  utter_ask_program_friendly:
    - text: "Bạn muốn hỏi về ngành nào nè? 🎓"
    - text: "Ngành nào bạn quan tâm vậy? 😊"
    - text: "Cho mình biết tên ngành bạn đang tìm hiểu nha! 📚"
    - text: "Bạn đang tìm hiểu ngành gì đấy? 💡"
    - text: "Ngành nào mà bạn thích vậy? ✨"
  
  utter_ask_scholarship_type_friendly:
    - text: "Bạn muốn biết về loại học bổng nào nè? 🎓"
    - text: "Học bổng nào mà bạn quan tâm vậy? 💰"
    - text: "Cho mình biết bạn đang tìm hiểu học bổng gì nha! 🌟"
  
  utter_ask_campus_friendly:
    - text: "Bạn muốn biết về cơ sở nào nè? 🏫"
    - text: "Cơ sở 1 hay cơ sở 2 vậy bạn? 📍"
    - text: "Bạn quan tâm đến cơ sở nào ở VHU? 🏢"
  
  # ACKNOWLEDGMENTS
  utter_got_it:
    - text: "Oke, mình hiểu rồi nha! ✅"
    - text: "Được rồi, để mình check giúp bạn nè! 🔍"
    - text: "Uhm uhm, mình nắm rồi! 👌"
    - text: "Okii, mình tra ngay cho bạn nha! 🚀"
    - text: "Rồi rồi, mình tìm giúp bạn liền! 💪"
  
  utter_checking:
    - text: "Đợi mình xíu nha, đang tra thông tin... ⏳"
    - text: "Mình đang tìm kiếm thông tin cho bạn đây... 🔍"
    - text: "Chờ mình một chút nha, mình sẽ tra ngay! ⌛"
  
  # CLARIFICATIONS
  utter_clarify_program:
    - text: "Bạn ơi, bạn đang nói về ngành **{program}** đúng không nè? 🤔"
    - text: "Xác nhận lại nha, bạn hỏi về **{program}** phải không? ✅"
    - text: "Để mình chắc chắn nè, bạn muốn biết về ngành **{program}** đúng không? 💡"
  
  utter_did_that_help:
    - text: "Thông tin này có giúp ích cho bạn không nè? 😊"
    - text: "Bạn còn cần biết thêm gì nữa không? 💬"
    - text: "Mình đã trả lời đủ chưa bạn? 🤗"
    - text: "Còn gì cần mình giúp thêm không nè? ✨"
  
  # FOLLOW-UP SUGGESTIONS
  utter_suggest_scholarship:
    - text: "À mà bạn có muốn biết về học bổng cho ngành này không? 🎓"
    - text: "Ngoài ra, bạn quan tâm đến học bổng không nè? 💰"
    - text: "Bạn có thể xem thêm về các học bổng VHU cung cấp đó! 🌟"
  
  utter_suggest_admission:
    - text: "Bạn muốn biết thêm về tuyển sinh cho ngành này không? 📝"
    - text: "À, bạn có muốn tìm hiểu cách đăng ký nhập học không? 📋"
    - text: "Nếu bạn thích ngành này, mình có thể tư vấn về tuyển sinh nha! ✨"
  
  utter_suggest_campus:
    - text: "Bạn có muốn biết ngành này học ở cơ sở nào không? 🏫"
    - text: "À, bạn quan tâm đến địa điểm học không nè? 📍"
  
  utter_suggest_career:
    - text: "Bạn có muốn biết cơ hội việc làm sau khi ra trường không? 💼"
    - text: "Mình có thể kể cho bạn nghe về nghề nghiệp sau này luôn nè! 🚀"
  
  # CHỨC NĂNG MỚI - CHỈ ĐƯỜNG
  utter_ask_user_location:
    - text: "Bạn đang ở đâu vậy? 📍\nVí dụ: 'Tôi ở đường Tân Hương, Tân Phú'"
    - text: "Cho mình biết địa chỉ hiện tại của bạn nha! 📍\n(VD: 'Quận 9' hoặc '123 Lê Văn Việt, Quận 9')"
    - text: "Bạn xuất phát từ đâu vậy? 🗺️\nNhập địa chỉ giúp mình nhé!"
  
  utter_ask_target_campus:
    - text: |
        Bạn muốn đến cơ sở nào của VHU nè? 🏫
        
        1️⃣ **Trụ sở chính** - HungHau House: 613 Âu Cơ, Tân Phú
        2️⃣ **Harmony Campus** - 624 Âu Cơ, Bảy Hiền
        3️⃣ **HungHau Campus** - 13E Đại lộ Nguyễn Văn Linh, Bình Hưng
        4️⃣ **myU Campus** - 665-667-669 Điện Biên Phủ, Bàn Cờ
        5️⃣ **Nguyễn Bá Tuyển Campus** - 8-14 Nguyễn Bá Tuyển, Bảy Hiền
        6️⃣ **Quốc lộ 1A Campus** - 2A2 Quốc lộ 1A, Thới An
        7️⃣ **615 Âu Cơ Campus** - 615 Âu Cơ, Tân Phú
        
        Bạn chọn số hoặc gõ tên cơ sở nhé! 😊
  
  utter_directions_processing:
    - text: "Đợi mình xíu nha, đang tìm đường đi tối ưu cho bạn... 🗺️"
    - text: "Để mình tính toán đường đi giúp bạn nè... 🧭"
  
  # CONTEXT-AWARE RESPONSES
  utter_remember_program:
    - text: "À, bạn vừa hỏi về **{program}** mà nhỉ? 🤔"
    - text: "Đúng rồi, bạn đang tìm hiểu về **{program}** phải không? 💡"
  
  utter_multiple_programs_discussed:
    - text: "Uhm, bạn đã hỏi về vài ngành rồi nè. Bạn muốn so sánh chúng không? 📊"
    - text: "Mình thấy bạn quan tâm đến nhiều ngành đó! Bạn đang phân vân lựa chọn à? 🤷"
  
  # ENCOURAGEMENT
  utter_encourage:
    - text: "Chúc bạn tìm được ngành mình thích nha! 💪"
    - text: "Hy vọng thông tin này hữu ích cho bạn! ✨"
    - text: "Cố gắng nha bạn, tương lai tươi sáng lắm! 🌟"
    - text: "Mình tin bạn sẽ chọn được ngành phù hợp! 🎓"
  
  # APOLOGIZING
  utter_cant_help:
    - text: "Híc, mình chưa có thông tin này nè. Bạn có thể gọi hotline **028 7301 5555** để được tư vấn chi tiết hơn nha! 📞"
    - text: "Ôi bạn ơi, phần này mình chưa rõ lắm. Liên hệ phòng tuyển sinh để được giúp đỡ tốt hơn nha: **028 7301 5555** 💙"
    - text: "Xin lỗi bạn nha, mình chưa được học về phần này. Hãy gọi cho bộ phận hỗ trợ ở **028 7301 5555** nhé! 🙏"
  
  # SMALL TALK
  utter_how_are_you:
    - text: "Mình là bot nên luôn khỏe ạ! 😄 Còn bạn thì sao nè?"
    - text: "Mình vẫn ổn nè, cảm ơn bạn đã hỏi! 💙 Bạn có cần mình giúp gì không?"
  
  utter_compliment_response:
    - text: "Aww, cảm ơn bạn nha! 🥰 Mình sẽ cố gắng giúp bạn tốt nhất có thể!"
    - text: "Hehe, bạn khen mình ngại quá! 😊 Có gì cần giúp cứ hỏi nha!"
  
  # ERROR HANDLING
  utter_default_fallback_friendly:
    - text: "Ôi bạn ơi, mình chưa hiểu lắm nè. Bạn có thể nói lại rõ hơn được không? 😅"
    - text: "Híc, mình hơi bối rối với câu hỏi này. Bạn thử hỏi cách khác được không? 🤔"
    - text: "Xin lỗi bạn, mình chưa nắm được ý bạn. Có thể diễn đạt lại không nè? 🙏"
  
  # PROACTIVE HELP
  utter_offer_help:
    - text: "Bạn có muốn mình giới thiệu thêm về VHU không nè? 😊"
    - text: "Mình có thể giúp bạn tìm hiểu về học phí, học bổng, tuyển sinh... Bạn cần gì nè? 💡"
    - text: "Ngoài ra, bạn còn muốn biết thêm điều gì không? Mình sẵn sàng giúp nha! ✨"
  
  # COMPARISON
  utter_compare_programs:
    - text: "Bạn muốn so sánh 2 ngành này không nè? Mình có thể so sánh học phí, thời gian học, cơ hội việc làm luôn đó! 📊"
  
  # WRAP UP
  utter_anything_else:
    - text: "Còn gì mình có thể giúp nữa không bạn? 💬"
    - text: "Bạn có câu hỏi nào khác không nè? 🤗"
    - text: "Hỏi mình thêm đi bạn, đừng ngại nha! 😊"
  
  utter_wrap_up:
    - text: "Chúc bạn lựa chọn được ngành mình yêu thích và thành công nha! 🎓✨"
    - text: "Hy vọng mình đã giúp bạn có thêm thông tin hữu ích! Chúc bạn may mắn! 🍀"
    - text: "Nếu còn thắc mắc gì, cứ quay lại hỏi mình nha bạn! Chúc học tốt! 💪"

