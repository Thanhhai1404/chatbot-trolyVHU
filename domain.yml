# FORMS - Thu thập thông tin qua slot filling (BƯỚC 2)
# =============================================================================

forms:
  tuition_form:
    required_slots:
      - program
  
  scholarship_form:
    required_slots:
      - scholarship_type
  
  admission_form:
    required_slots:
      - program
  
  campus_form:
    required_slots:
      - campus
  
  # CHỨC NĂNG MỚI - CHỈ ĐƯỜNG
  directions_form:
    required_slots:
      - user_location
      - target_campus

