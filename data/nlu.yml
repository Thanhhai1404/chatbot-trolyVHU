# Regex patterns để cải thiện intent recognition
regex:
  - name: tuyen_sinh
    pattern: (tuyển sinh|tuyển|xét tuyển|xét|phương thức tuyển|phương thức xét|hình thức tuyển|hình thức xét)
    
  - name: co_so
    pattern: (cơ sở|campus|địa chỉ các cơ sở|cơ sở chính|cơ sở \d+)
    
  - name: hoc_phi
    pattern: (học phí|hoc phi|tuition|tiền học|đóng học)
    
  - name: hoc_bong
    pattern: (học bổng|hoc bong|scholarship|trợ cấp)

