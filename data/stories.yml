# =============================================================================
# PROGRAM RECOMMENDATION STORIES - Tư vấn ngành
# =============================================================================

- story: recommend programs with subject combination
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: "A00"
    - action: action_recommend_programs

- story: recommend programs with interest
  steps:
    - intent: ask_recommend_programs
      entities:
        - interest: "công nghệ"
    - action: action_recommend_programs

- story: recommend programs with both subject and interest
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: "D01"
        - interest: "kinh doanh"
    - action: action_recommend_programs

- story: recommend then ask tuition
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: "A00"
        - interest: "công nghệ"
    - action: action_recommend_programs
    - intent: ask_tuition_specific
      entities:
        - program: "Công nghệ thông tin"
    - action: action_tuition_specific

- story: recommend then ask program info
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: "C00"
        - interest: "truyền thông"
    - action: action_recommend_programs
    - intent: ask_program_info
      entities:
        - program: "Báo chí"
    - action: action_program_info

- story: greet then recommend programs
  steps:
    - intent: greet
    - action: utter_greet
    - intent: ask_recommend_programs
      entities:
        - subject_combination: "A01"
        - interest: "IT"
    - action: action_recommend_programs
    - intent: thank
    - action: utter_thank

