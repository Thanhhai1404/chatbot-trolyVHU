version: "3.1"

stories:

- story: greet user
  steps:
    - intent: greet
    - action: utter_greet

- story: goodbye user
  steps:
    - intent: goodbye
    - action: utter_goodbye

- story: thank user
  steps:
    - intent: thank
    - action: utter_thank

- story: ask about school
  steps:
    - intent: ask_about_school
    - action: utter_about_school

- story: list programs
  steps:
    - intent: ask_list_programs
    - action: action_list_all_programs

- story: program info
  steps:
    - intent: ask_program_info
    - action: action_program_info

