- story: user wants program recommendation without details
  steps:
    - intent: ask_recommend_programs
    - action: action_recommend_programs
    - intent: inform
      entities:
        - subject_combination: A00
        - interest: công nghệ
    - action: action_recommend_programs

- story: user wants program recommendation with subject combo
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: D01
    - action: action_recommend_programs

- story: user wants program recommendation with interest
  steps:
    - intent: ask_recommend_programs
      entities:
        - interest: kinh doanh
    - action: action_recommend_programs

- story: user wants program recommendation full info
  steps:
    - intent: ask_recommend_programs
      entities:
        - subject_combination: A00
        - interest: công nghệ
    - action: action_recommend_programs
    - intent: ask_tuition_specific
      entities:
        - program: Công nghệ thông tin
    - action: action_tuition_specific

