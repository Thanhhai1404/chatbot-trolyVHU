# Stories cho các intents với custom actions
- story: tuition specific info with action
  steps:
    - intent: ask_tuition_specific
    - action: action_tuition_specific

- story: scholarship condition info with action
  steps:
    - intent: ask_scholarship_condition
    - action: action_scholarship_condition

- story: exam schedule info with action
  steps:
    - intent: ask_exam_schedule
    - action: action_exam_schedule

- story: campuses info with action
  steps:
    - intent: ask_campuses
    - action: action_campuses_info

- story: support problem info with action
  steps:
    - intent: ask_support_problem
    - action: action_support_problem

- story: program info with action
  steps:
    - intent: ask_program_info
    - action: action_program_info

- story: major count info
  steps:
    - intent: ask_major_count
    - action: utter_major_count

- story: study mode info
  steps:
    - intent: ask_study_mode
    - action: utter_study_mode

- story: admission time info
  steps:
