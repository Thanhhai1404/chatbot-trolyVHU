    - action: utter_admission_time

- story: fee payment info
  steps:
    - intent: ask_fee_payment
    - action: utter_fee_payment

# Complex conversation stories
- story: user asks about specific program tuition
  steps:
    - intent: greet
    - action: utter_greet
    - intent: ask_tuition_specific
      entities:
        - program: "Công nghệ thông tin"
    - action: action_tuition_specific
    - intent: thank
    - action: utter_thank

- story: user asks about scholarship conditions and then specific program
  steps:
    - intent: ask_scholarship_condition
    - action: action_scholarship_condition
    - intent: ask_tuition_specific
      entities:
        - program: "Marketing"
    - action: action_tuition_specific

- story: user asks about exam schedule and then campus info
  steps:
    - intent: ask_exam_schedule
    - action: action_exam_schedule
    - intent: ask_campuses
    - action: action_campuses_info

- story: user needs support and then asks about admission time
  steps:
    - intent: ask_support_problem
    - action: action_support_problem
    - intent: ask_admission_time
    - action: utter_admission_time

- story: user asks about study modes and fee payment
  steps:
    - intent: ask_study_mode
    - action: utter_study_mode
    - intent: ask_fee_payment
    - action: utter_fee_payment

- story: user asks about program info then tuition
  steps:
    - intent: ask_program_info
      entities:
        - program: "CNTT"
    - action: action_program_info
    - intent: ask_tuition_specific
      entities:
        - program: "CNTT"
    - action: action_tuition_specific

