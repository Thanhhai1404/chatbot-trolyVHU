# =============================================================================
# FORM RULES - BƯỚC 2 (SIMPLIFIED)
# =============================================================================
# Forms activate only for general questions (missing entity)
# Follow-up actions handled in stories to avoid conflicts

- rule: Activate tuition form
  steps:
    - intent: ask_tuition
    - action: tuition_form
    - active_loop: tuition_form

- rule: Submit tuition form
  condition:
  - active_loop: tuition_form
  steps:
  - action: tuition_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_tuition_specific

# =============================================================================
# GEMINI AI FALLBACK - GIAI ĐOẠN 3
# =============================================================================
# Xử lý câu hỏi ngoài phạm vi bằng Gemini AI

- rule: Gemini AI fallback for out-of-scope questions
  steps:
    - intent: out_of_scope
    - action: action_gemini_fallback

- rule: Gemini AI fallback for nlu_fallback
  steps:
    - intent: nlu_fallback
    - action: action_gemini_fallback

- rule: Track conversation context
  steps:
    - action: action_track_conversation

# =============================================================================
# DIRECTIONS RULES - Chức năng chỉ đường (CHỨC NĂNG MỚI)
# =============================================================================

- rule: Activate directions form
  steps:
    - intent: ask_directions
    - action: directions_form
    - active_loop: directions_form

- rule: Submit directions form
  condition:
    - active_loop: directions_form
  steps:
    - action: directions_form
    - active_loop: null
    - action: action_get_directions

- rule: Show transit info when user confirms
  steps:
    - intent: confirm_transit_info
    - action: action_show_transit_info
