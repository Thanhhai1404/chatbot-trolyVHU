# =============================================================================
# CUSTOM ACTION RULES
# =============================================================================

- rule: program info
  steps:
    - intent: ask_program_info
    - action: action_program_info

- rule: tuition specific
  steps:
    - intent: ask_tuition_specific
    - action: action_tuition_specific

- rule: scholarship condition
  steps:
    - intent: ask_scholarship_condition
    - action: action_scholarship_condition

- rule: exam schedule
  steps:
    - intent: ask_exam_schedule
    - action: action_exam_schedule

- rule: campuses info
  steps:
    - intent: ask_campuses
    - action: action_campuses_info

- rule: support problem
  steps:
    - intent: ask_support_problem
    - action: action_support_problem

- rule: recommend programs by subject combination and interest
  steps:
    - intent: ask_recommend_programs
    - action: action_recommend_programs

# =============================================================================
# TƯ VẤN NGÀNH HỌC RULES
# =============================================================================

- rule: recommend programs when asked
  steps:
    - intent: ask_recommend_programs
    - action: action_set_slots_to_none  # Reset slots trước khi hỏi
    - action: action_recommend_programs

