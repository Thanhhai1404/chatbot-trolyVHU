version: "3.1"

rules:

# =============================================================================
# BASIC RULES - Simple responses
# =============================================================================

- rule: greet user anytime
  steps:
    - intent: greet
    - action: utter_greet

- rule: say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: respond to thank
  steps:
    - intent: thank
    - action: utter_thank

- rule: handle about school
  steps:
    - intent: ask_about_school
    - action: utter_about_school

- rule: list programs
  steps:
    - intent: ask_list_programs
    - action: action_list_all_programs

- rule: scholarship info
  steps:
    - intent: ask_scholarship
    - action: utter_scholarship

- rule: admission methods
  steps:
    - intent: ask_admission_methods
    - action: utter_admission_methods

- rule: admission documents
  steps:
    - intent: ask_admission_documents
    - action: utter_admission_documents

- rule: school location
  steps:
    - intent: ask_location
    - action: utter_location

- rule: contact info
  steps:
    - intent: ask_contact
    - action: utter_contact

- rule: schedule info
  steps:
    - intent: ask_schedule
    - action: utter_schedule

- rule: facility info
  steps:
    - intent: ask_facility
    - action: utter_facility

- rule: dorm info
  steps:
    - intent: ask_dorm
    - action: utter_dorm

- rule: club info
  steps:
    - intent: ask_club
    - action: utter_club

- rule: support info
  steps:
    - intent: ask_support
    - action: utter_support

- rule: bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_bot_challenge

